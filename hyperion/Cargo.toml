[package]
name = "hyperion"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "runtime"]

[dependencies]
apeiron = { path = "../apeiron" }
archon = { path = "../archon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hyperion-runtime = { path = "runtime" }

[[bin]]
name = "hyperion"
path = "src/main.rs"
