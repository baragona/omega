[package]
name = "metacosm"
version = "0.1.0"
edition = "2021"
description = "A formal system in which universes are dynamic, first-class epistemic objects"

[workspace]

[dependencies]
apeiron = { path = "../apeiron" }
hyperion = { path = "../hyperion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "metacosm"
path = "src/main.rs"
